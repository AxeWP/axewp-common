name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Used to determine what version of PHP to use for the other jobs.
      php-version: '8.5'
      actionlint: ${{ steps.filter.outputs.actionlint }}
      php: ${{ steps.filter.outputs.php }}
      phpcs: ${{ steps.filter.outputs.phpcs }}
      phpstan: ${{ steps.filter.outputs.phpstan }}
      phpunit: ${{ steps.filter.outputs.phpunit }}
      js: ${{ steps.filter.outputs.js }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            actionlint:
              - '.github/workflows/**'
            js:
              - '.github/workflows/ci.yml'
              - '.nvmrc'
              - '**.json'
              - '**.*js'
              - '**.ts'
              - '**.ts*'
              - 'package*.json'
            php:
              - '**.php'
              - 'composer.*'
            phpcs:
              - '.github/workflows/ci.yml'
              - '.phpcs.xml.dist'
            phpstan:
              - '.github/workflows/ci.yml'
              - 'phpstan.neon.dist'
            phpunit:
              - '.github/workflows/ci.yml'
              - 'tests/**/*.php'
              - 'phpunit.xml.dist'
              - '.wp-env.test.json'

  actionlint:
    name: actionlint
    needs: detect
    if: needs.detect.outputs.actionlint == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-actionlint.yml@47e89d06e15846d34d5f6eb7dfcd3a4dccd83750 # v0.4.0
    permissions:
      contents: read

  phpcs:
    name: PHPCS
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpcs == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpcs.yml@47e89d06e15846d34d5f6eb7dfcd3a4dccd83750 # v0.4.0
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}

  phpstan:
    name: PHPStan
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpstan == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpstan.yml@47e89d06e15846d34d5f6eb7dfcd3a4dccd83750 # v0.4.0
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    needs: detect
    if: needs.detect.outputs.php == 'true' || needs.detect.outputs.phpunit == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-phpunit.yml@47e89d06e15846d34d5f6eb7dfcd3a4dccd83750 # v0.4.0
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.3', '8.2']
        wp: ['7.0', '6.9', '6.8', '6.7', '6.6']
        include: # Track coverage on the latest version only.
          - wp: '7.0'
            php: '8.5'
            coverage: true
    with:
      php-version: ${{ matrix.php }}
      wp-version: ${{ matrix.wp }}
      coverage: ${{ matrix.coverage || false }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  js:
    name: JS Checks
    needs: detect
    if: needs.detect.outputs.js == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-js-lints.yml@47e89d06e15846d34d5f6eb7dfcd3a4dccd83750 # v0.4.0
    permissions:
      contents: read
    with:
      eslint: false
      prettier: true
      stylelint: false
      tsc: true

  graphql:
    name: GraphQL Schema Linter
    needs: detect
    if: needs.detect.outputs.js == 'true' || needs.detect.outputs.php == 'true'
    uses: AxeWP/plugin-infra/.github/workflows/reusable-graphql-schema-linter.yml@47e89d06e15846d34d5f6eb7dfcd3a4dccd83750 # v0.4.0
    permissions:
      contents: read
    with:
      php-version: ${{ needs.detect.outputs.php-version }}
      plugin-slug: 'axewp-common'
      previous-schema-url: 'https://github.com/AxeWP/axewp-common/releases/latest/download/schema.graphql'
